name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.14'

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements.txt

      - name: Block legacy discovery code
        run: bash scripts/check_legacy_discovery.sh

      - name: Verify discovery sources remain enabled
        run: bash scripts/check_discovery_sources.sh

      - name: Run unit tests
        # pytest, not `python -m unittest discover`: tests/conftest.py's
        # autouse fixtures (forcing AUTH_DISABLED off, popping any real
        # ANTHROPIC_API_KEY, and pinning TIER_C_PARALLEL_SHADOW_SAMPLE_RATE
        # to 0.0 for tests that don't explicitly want fan-out) are a
        # pytest-only mechanism -- conftest.py is never imported by plain
        # unittest discovery, since it doesn't match the `test*.py` glob.
        # Running under `unittest` silently skipped all three, which is
        # what made the sample-rate fixture's ~1-in-20-per-call flake
        # (Step 10 Phase 6 raised the real default off 0.0) an intermittent
        # CI failure instead of the non-issue it is under pytest.
        run: python -m pytest tests/
